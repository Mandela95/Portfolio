name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Format + Lighthouse
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm ci installs the locked versions exactly, so CI cannot silently pick up a
      # newer Prettier that formats the repo differently than it does locally.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # Serves the repo as-is; there is no build step.
      - name: Lighthouse audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
